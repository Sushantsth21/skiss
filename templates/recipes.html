<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe Ideas - SKISS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-dark bg-success mb-4">
        <div class="container">
            <a href="/" class="navbar-brand mb-0 h1">← Back to Pantry</a>
        </div>
    </nav>

    <div class="container">
        <h3 class="mb-4">Recipes Based on Your Ingredients</h3>

        {% if error %}
        <div class="alert alert-warning" role="alert">
            {{ error }}
        </div>
        <a href="/" class="btn btn-primary">Go Back</a>
        {% else %}
        
        <div class="row row-cols-1 row-cols-md-3 g-4">
            {% for recipe in recipes %}
            <div class="col">
                <div class="card h-100 shadow-sm">
                    <img src="{{ recipe.image }}" class="card-img-top" alt="{{ recipe.title }}">
                    <div class="card-body">
                        <h5 class="card-title">{{ recipe.title }}</h5>
                        <p class="card-text">
                            <span class="badge bg-success">Have: {{ recipe.usedIngredientCount }}</span>
                            <span class="badge bg-danger">Missing: {{ recipe.missedIngredientCount }}</span>
                        </p>
                    </div>
                    <div class="card-footer bg-white border-top-0">
                        <a href="https://google.com/search?q={{ recipe.title }} recipe" target="_blank" class="btn btn-outline-success w-100">View Recipe</a>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
        {% endif %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
